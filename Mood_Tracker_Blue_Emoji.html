<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
body{font-family:Arial;background:#fff;display:flex;justify-content:center;padding:20px}.cal{width:340px}.header{display:flex;align-items:center;margin-bottom:16px}.nav{cursor:pointer;color:#225688;font-size:22px;padding:6px}.month{flex:1;text-align:center;font-family:"Times New Roman";font-size:28px;color:#225688;font-weight:bold}.days{display:grid;grid-template-columns:repeat(7,1fr);margin:0 0 14px;font-family:"Times New Roman";color:#225688}.days div{text-align:center;font-weight:bold;color:#225688}.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.cell{width:38px;height:38px;border-radius:6px;background:#f2f2f2;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:22px;line-height:1;user-select:none}.footer{display:flex;justify-content:space-between;align-items:center;margin-top:14px}button{padding:8px 12px;background:#225688;color:#fff;border:none;border-radius:8px}.brand{font-size:11px;color:#A9CBE0;font-family:"Times New Roman"}</style></head><body><div class="cal"><div class="header"><div class="nav" onclick="change(-1)">❮</div><div id="month" class="month"></div><div class="nav" onclick="change(1)">❯</div></div><div class="days"><div>S</div><div>M</div><div>T</div><div>W</div><div>T</div><div>F</div><div>S</div></div><div id="grid" class="grid"></div><div class="footer"><button onclick="resetMonth()">Reset Month</button><div class="brand">by skyu.planner</div></div></div><script>
const names=["January","February","March","April","May","June","July","August","September","October","November","December"];
const moods=["","😆","🙂","☺️","😑","😔","☹️","😢","😡","🤒","😴","🤯","😵","🤩","😋"];
const today=new Date();
let view=new Date(today.getFullYear(),today.getMonth(),1);

function storageKey(){
  return "mood-"+view.getFullYear()+"-"+(view.getMonth()+1);
}

function render(){
  month.textContent=names[view.getMonth()]+" "+view.getFullYear();
  grid.innerHTML="";
  const data=JSON.parse(localStorage.getItem(storageKey())||"{}");
  const first=new Date(view.getFullYear(),view.getMonth(),1).getDay();
  const total=new Date(view.getFullYear(),view.getMonth()+1,0).getDate();

  for(let i=0;i<first;i++) grid.appendChild(document.createElement("div"));

  for(let d=1;d<=total;d++){
    const c=document.createElement("div");
    c.className="cell";
    let idx=data[d]||0;
    c.textContent=moods[idx];

    if(view.getFullYear()==today.getFullYear() &&
       view.getMonth()==today.getMonth() &&
       d==today.getDate()){
      c.style.outline="2px solid #092C56";
      c.style.outlineOffset="2px";
    }

    c.onclick=()=>{
      idx=(idx+1)%moods.length;
      c.textContent=moods[idx];
      if(idx===0) delete data[d];
      else data[d]=idx;
      localStorage.setItem(storageKey(),JSON.stringify(data));
    };

    grid.appendChild(c);
  }
}

function change(n){view.setMonth(view.getMonth()+n);render();}
function resetMonth(){localStorage.removeItem(storageKey());render();}
render();
</script></body></html>
